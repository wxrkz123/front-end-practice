<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 元素选择器 */
        h2 {
            color: blue;
            font-size: 20px;
        }

        /* 类选择器 */
        .highlight {
            color: red;
            font-size: 18px;
        }

        /* ID选择器 */
        #unique {
            color: green;
            font-size: 16px;
        }

        /* 通用选择器 */
        * {
            color: purple;
            font-size: 14px;
        }

        /* 子元素选择器 */
        .parent > .child {
            color: orange;
            font-size: 12px;
        }

        /* 后代元素选择器 */
        .parent p {
            color: brown;
            font-size: 10px;
        }

        /* 相邻兄弟选择器 */
        h3 + p {
            color: pink;
            font-size: 8px;
        }

        /* 伪类选择器 */
        #element:hover {
            color: yellow;
            font-size: 6px;
        }
        </style>

</head>
<body>
    
    <h1>不同类型的css选择器</h1>
    <h2>这是一个元素选择器示例</h2>
    <h3 class="highlight">这是一个类选择器示例</h3>
    <h4 id="unique">这是一个ID选择器示例</h4>
    <h5>这是一个通用选择器示例</h5>

    <div class="parent">
        <p class="child">这是一个子元素选择器示例</p>
        <div>
            <p class="grandson">这是一个后代元素选择器示例</p>
        </div>
    </div>

    <p>这是一个p标签</p>
    <h3>这是一个相邻兄弟选择器示例</h3>
    <p>这是另一个p标签</p>

    <h3 id="element">这是一个伪类选择器示例</h3>
</body>
</html>
