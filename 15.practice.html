<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Practice</h1>
    <button onclick="addContact()">New Contact</button>
    <table id="contactTable">
        <tr>
            <th>Name</th>
            <th>Telephone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>123-456-7890</td>
            <td>john.doe@example.com</td>
            <td>
                <button onclick="editContact(this)">Edit</button>
                <button onclick="deleteContact(this)">Delete</button>
            </td>
        </tr>
    </table>
    <script src="table.js"></script>
</body>
</html>
