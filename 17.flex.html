<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            /* 主轴方向：row（默认）| row-reverse | column | column-reverse */
            flex-direction: row;
    
            /* 主轴对齐：flex-start | center | flex-end | space-between | space-around | space-evenly */
            justify-content: space-between;
    
            /* 交叉轴对齐：flex-start | center | flex-end | stretch（默认）| baseline */
            align-items: center;
    
            /* 换行：nowrap（默认）| wrap | wrap-reverse */
            flex-wrap: wrap;
    
            gap: 16px;
            /* 项目间距 */
            padding: 20px;
            background: #f0f4f8;
            border-radius: 12px;
        }
    
        .item {
            width: 100px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
</body>
</html>
