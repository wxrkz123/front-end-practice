<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {
            background-color: red;
            width: 150px;
            height: 100px;
        }

        .inline {
            background-color: blue;
            width: 200px;
            height: 200px;
        }

        .inline-block {
            background-color: green;
            width: 100px;
            height: 150px;
        }

        .div-inline {
            display: inline;
            background-color: yellow;
        }

        .span-inline-block {
            display: inline-block;
            background-color: pink;
            width: 300px;
            height: 100px;
        }

    </style>
</head>
<body>
    <h1 style="font: bolder 50px">
        这是一个font复合属性示例
    </h1>

    <p style="line-height: 40px">
        这是一个line-height属性示例
    </p>

    <div class="block">
        这是一个块级元素    
    </div>

    <span class="inline">
        这是一个行内元素
    </span>

    <img src="https://www.baidu.com/img/bd_logo1.png" alt="图片" class="inline-block">

    <h2>display</h2>

    <div class="div-inline">
        这是一个转换成行内元素的div标签
    </div>

    <span class="span-inline-block">
        这是一个转换成行内块元素的span标签
    </span>
</body>
</html>
