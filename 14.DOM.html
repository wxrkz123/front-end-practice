<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box1">This is an ID selector tag.</div>
    <div class="box2">This is a class selector tag.</div>
    <div>This is a tag selector tag.</div>
    <script>
        // ID selector
        const box1 = document.getElementById('box1');
        box1.style.color = 'blue';

        // Class selector
        const box2 = document.getElementsByClassName('box2')[0];
        box2.style.color = 'green';

        // Tag selector
        const divs = document.getElementsByTagName('div');
        for (let i = 0; i < divs.length; i++) {
            divs[i].style.fontSize = '20px';
        }

        element_id.innerHTML = "This is a fixed ID selector tag.";
        element_class.innerText = "This is a fixed class selector tag.";

        var button = document.createElement("button");
        button.innerHTML = "Click Me";
        button.onclick = function() {
            alert("Button was clicked!");
        };
        document.body.appendChild(button);
        
    </script>
</body>
</html>
