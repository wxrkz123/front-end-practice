<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .border-box {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border-style: solid;
            border-width: 5px;
            border-color: red;
        }

        .content-box {
            background-color: lightgreen;
            display: inline-block;
            border: 5px solid blue;
            padding: 20px;
            margin: 10px;
        }
        </style>
</head>
<body>
    
    <div class="border-box">
        这是一个border-box示例
    </div>

    <div class="content-box">
        这是一个content-box示例
    </div>

</body>
</html>
