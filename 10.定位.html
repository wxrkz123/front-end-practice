<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            height: 350px;
            background-color: lightblue;
        }

        .box-normal {
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .box-relative {
            width: 100px;
            height: 100px;
            background-color: green;
            position: relative;
            top: 100px;
            left: 100px;
        }

        .box2 {
            height: 350px;
            background-color: lightcoral;
            margin-bottom: 300px;
        }

        .box-absolute {
            width: 100px;
            height: 100px;
            background-color: yellow;
            position: absolute;
            top: 100px;
            left: 100px;
        }

        .box3 {
            height: 350px;
            background-color: lightgreen;
        }

        .box-fixed {
            width: 100px;
            height: 100px;
            background-color: orange;
            position: fixed;
            top: 100px;
            right: 100px;
        }

    </style>
</head>
<body>
    <h1>相对定位</h1>
    <div class="box1">
        <div class="box-normal">正常流</div>
        <div class="box-relative">相对定位</div>
        <div class="box-normal">正常流</div>
    </div>
    
    <h2>绝对定位</h2>
    <div class="box2">
        <div class="box-normal">正常流</div>
        <div class="box-absolute">绝对定位</div>
        <div class="box-normal">正常流</div>
    </div>

    <h2>固定定位</h2>
    <div class="box3">
        <div class="box-normal">正常流</div>
        <div class="box-fixed">固定定位</div>
        <div class="box-normal">正常流</div>
    </div>
</body>
</html>
